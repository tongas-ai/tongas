name: release-please

on:
  push:
    branches:
      - main
  # Dispatched by merge-on-approval, since merges made with GITHUB_TOKEN
  # don't trigger push events.
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
